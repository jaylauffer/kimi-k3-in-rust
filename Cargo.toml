[workspace]
members = ["crates/kimi-k3-core", "crates/kimi-k3-cli"]
default-members = ["crates/kimi-k3-core", "crates/kimi-k3-cli"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/jaylauffer/kimi-k3-in-rust"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
