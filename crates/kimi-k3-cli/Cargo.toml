[package]
name = "kimi-k3-cli"
version = "0.1.0"
description = "CLI for the Rust Kimi K3 inference engine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "k3"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
kimi-k3-core = { path = "../kimi-k3-core" }
# Framework owns reusable conversation/generation mechanics. See docs/CHAT.md
# for the sibling-checkout layout and coordinated publication requirements.
loadngo-inference = { path = "../../../loadngo/inference", features = ["cas"] }
# The signed Archive CAS view behind the chat file tools.
data = { path = "../../../loadngo/data" }
# Thermal pressure before every forward pass; the proactor waits while paused.
loadngo-thermal = { path = "../../../loadngo/thermal" }
loadngo-weights = { path = "../../../loadngo/weights" }
serde_json = "1.0"
loadngo-proactor = { path = "../../../loadngo/proactor" }
ctrlc = "3.5"

[target.'cfg(target_os = "macos")'.dependencies]
# Apple Neural Engine for --accel ane (the only unsafe code, audited, lives there).
loadngo-coreml = { path = "../../../loadngo/coreml" }
# The GPU for --accel gpu: resident weights and Metal matrix-vector kernels.
loadngo-metal-compute = { path = "../../../loadngo/metal-compute" }

[dev-dependencies]
serde_json = "1"
